name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  build-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install package
        run: uv sync --locked --dev --python 3.12

      - name: Ruff (lint)
        run: uv run --locked --dev ruff check src/ tests/

      - name: Black (format check)
        run: uv run --locked --dev black --check src/ tests/

      - name: Mypy (type check)
        run: uv run --locked --dev mypy src/

      - name: Pytest
        run: uv run --locked --dev pytest -q