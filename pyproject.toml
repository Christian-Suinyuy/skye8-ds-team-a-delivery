[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skye8-ds-team-a-delivery"
version = "0.1.0"
description = "Skye8 SKY8-DS-PR2-A - credit risk model delivery platform"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "mlflow>=2.10",
    "fastapi>=0.110",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# --- Linting -----------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# --- Formatting ----------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py311"]

# --- Type checking ---------------------------------------------------------
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false

# --- Tests -----------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
