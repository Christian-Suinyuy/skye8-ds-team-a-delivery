[project]
name = "api"
version = "0.1.0"
description = "End-to-end ML platform for credit risk prediction, model serving, deployment, and production monitoring."
readme = "README.md"
authors = [
    { name = "BCS", email = "christiansuinyuy@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "pandas>=3.0.5",
    "psycopg2>=2.9.12",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2]>=0.3.1",
    "pydantic[email]>=2.13.5",
    "pyjwt>=2.13.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
dev = "api:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
