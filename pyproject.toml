[project]
name = "api"
version = "0.1.0"
description = "Skye8 SKY8-DS-PR2-A - credit risk model delivery platform"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "mlflow[extras]>=2.10",
    "pyyaml>=6.0",
    "fastapi>=0.141.1",
    "psycopg2>=2.9.12",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2]>=0.3.1",
    "pydantic[email]>=2.13.5",
    "pyjwt>=2.13.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.9",
]

[project.scripts]
dev = "api:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# --- Linting -----------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# --- Formatting ----------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py311"]

# --- Type checking ---------------------------------------------------------
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false

# --- Tests -----------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68", "wheel", "uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
